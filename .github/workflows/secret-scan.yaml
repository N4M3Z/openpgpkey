name: Secret Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "41 3 * * 1"
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

env:
    GITLEAKS_VERSION: "8.30.1"
    GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
    sweep:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Scan repository history
              run: |
                  scan_dir=$(mktemp -d)
                  archive="$scan_dir/gitleaks.tar.gz"
                  curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
                  printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
                  tar -xzf "$archive" -C "$scan_dir" gitleaks
                  # Keep findings and their metadata out of public logs.
                  scan=0
                  "$scan_dir/gitleaks" git --no-banner --redact --exit-code 9 . >/dev/null 2>&1 || scan=$?
                  if [ "$scan" -eq 0 ]; then
                      echo "No secrets found in repository history."
                  elif [ "$scan" -eq 9 ]; then
                      echo "Secret scan found possible secrets. Inspect them locally with gitleaks git."
                      exit 1
                  else
                      echo "Secret scan did not complete."
                      exit "$scan"
                  fi
