name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Install WKD dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends python3 python3-yaml gnupg
            - name: Check WKD files and tests
              run: |
                  /usr/bin/python3 scripts/build-wkd.py --check
                  /usr/bin/python3 -m unittest discover -s tests
